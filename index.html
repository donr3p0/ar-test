<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastro AR Menu</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            font-family: sans-serif; 
        }
        
        .ar-start-button { 
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); 
            color: black; 
            border: none; 
            font-size: 20px; 
            font-weight: bold; 
            padding: 20px 40px; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.4);
        }

        .ar-start-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="ar-start-button" id="startBtn">
        Zobraziť burger na stole 🍔
    </button>

    <script>
        const btn = document.getElementById("startBtn");
        
        // Detekcia, či je to iPhone
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        btn.addEventListener("click", () => {
            if (isIOS) {
                // IPHONE:
                // allowsContentScaling=0 -> ZAKÁŽE zväčšovanie prstami.
                // canonicalWebPageURL -> TRIK NA ZDIEĽANIE! Namiesto súboru to bude zdieľať odkaz na tento web.
                const shareUrl = encodeURIComponent(window.location.href);
                const iosUrl = "burger.usdz#allowsContentScaling=0&canonicalWebPageURL=" + shareUrl;
                
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', iosUrl);
                anchor.click();
            } else {
                // ANDROID:
                // Úplne čistý systémový povel. Žiadny neviditeľný <model-viewer>.
                // resizable=false -> ZAKÁŽE zväčšovanie prstami.
                
                // Vygenerujeme presnú URL adresu k tvojmu burger.glb na Verceli
                const glbUrl = new URL('burger.glb', window.location.href).href;
                const fallbackUrl = encodeURIComponent(window.location.href);
                
                // Odpálime natívny Google Scene Viewer iba s foťákom (mode=ar_only)
                const androidIntent = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glbUrl) + "&mode=ar_only&resizable=false&title=Náš_Burger#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=" + fallbackUrl + ";end;";
                
                window.location.href = androidIntent;
            }
        });
    </script>

</body>
</html>
