<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastro AR Menu</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            font-family: sans-serif; 
        }
        
        .ar-start-button { 
            background-color: #ffcc00; 
            color: black; 
            border: none; 
            font-size: 20px; 
            font-weight: bold; 
            padding: 20px 40px; 
            border-radius: 50px; 
            cursor: pointer; 
        }

        /* Tento komponent musí byť v kóde pre Android, ale urobíme ho neviditeľným */
        model-viewer { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            opacity: 0; 
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <button class="ar-start-button" id="startBtn">
        Zobraziť burger na stole 🍔
    </button>

    <model-viewer id="viewer" src="burger.glb" ar ar-modes="scene-viewer"></model-viewer>

    <script>
        const btn = document.getElementById("startBtn");
        const viewer = document.getElementById("viewer");
        
        // Detekcia, či je to iPhone
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        btn.addEventListener("click", () => {
            if (isIOS) {
                // IPHONE: Priamy odkaz na model.
                // allowsContentScaling=1 ti konečne dovolí zmenšiť ho prstami natrvalo.
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', 'burger.usdz#allowsContentScaling=1');
                anchor.click();
            } else {
                // ANDROID: Oficiálne spustenie AR cez Google knižnicu (už to nebude blokovať kliknutie).
                viewer.activateAR();
            }
        });
    </script>

</body>
</html>
