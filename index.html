<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gastro AR Menu</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }
        .container { display: flex; flex-direction: column; align-items: center; }
        .ar-start-button { background: linear-gradient(135deg, #e6b800 0%, #cc9900 100%); color: black; border: none; font-size: 20px; font-weight: bold; padding: 20px 40px; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(230, 184, 0, 0.4); text-align: center; }
        .ar-start-button:active { transform: scale(0.95); }
        .hint-text { color: #aaa; font-size: 14px; margin-top: 15px; text-align: center; }

        /* SKRYTÝ PREHLIADAČ: Už žiadne otáčanie prstom na webe po zatvorení krížika na iPhone */
        model-viewer {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="ar-start-button" id="startBtn">
            Zobraziť burger na stole 🍔
        </button>
        <div class="hint-text">Naskenujte voľný stôl pred sebou</div>
    </div>

    <model-viewer id="fallbackViewer" src="burger.glb" ar ar-modes="scene-viewer"></model-viewer>

    <script>
        const startBtn = document.getElementById("startBtn");
        const modelViewer = document.getElementById("fallbackViewer");

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        startBtn.addEventListener("click", () => {
            if (isIOS) {
                // PRE IPHONE: 
                // canonicalWebPageURL=0 a allowsContentScaling=0 eliminujú zbytočné prvky.
                // Pridávame natívne vynútenie fixnej mierky priamo pre Quick Look rozhranie.
                const iosUrl = "burger.usdz#allowsContentScaling=0&canonicalWebPageURL=0";
                
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', iosUrl);
                anchor.click();
            } else {
                // PRE ANDROID: 
                // Prechádzame na najstabilnejší Google Scene Viewer režim (mode=ar_only).
                // Tento príkaz natvrdo zamkne burger na stôl, čím zabráni jeho plávaniu a pohybu s mobilom.
                const fallbackUrl = window.location.href;
                const glbUrl = window.location.origin + "/burger.glb";
                
                const androidIntent = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glbUrl) + "&mode=ar_only&title=Burger#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(fallbackUrl);
                
                window.location.href = androidIntent;
            }
        });
    </script>

</body>
</html>
