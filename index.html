<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastro AR Menu</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            font-family: sans-serif; text-align: center; color: white;
            overflow: hidden;
        }
        
        .ar-start-button { 
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); 
            color: black; border: none; font-size: 20px; font-weight: bold; 
            padding: 20px 40px; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.4);
            opacity: 0;
            animation: popInRotate 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes popInRotate {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .ar-start-button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <button class="ar-start-button" id="startBtn">
        Zobraziť burger na stole 🍔
    </button>

    <script>
        const btn = document.getElementById("startBtn");
        
        // Detekcia iPhonu
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        btn.addEventListener("click", () => {
            if (isIOS) {
                // IPHONE: Rýchle a čisté spustenie
                // allowsContentScaling=0 -> natrvalo uzamkne veľkosť z Unrealu
                // Tlačidlo zdieľania tu zostane (Apple to inak nedovolí)
                const iosUrl = "burger.usdz#allowsContentScaling=0";
                
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', iosUrl);
                anchor.click();
            } else {
                // ANDROID: Priamy systémový príkaz (Intent)
                // resizable=false -> zakáže zväčšovanie prstami
                // mode=ar_only -> spustí natívny foťák (ktorý má v sebe tlačidlo na fotenie)
                
                // Dynamicky získame presnú URL adresu modelu na tvojom webe
                const currentUrl = window.location.href;
                const glbUrl = new URL('burger.glb', currentUrl).href;
                
                const intentUrl = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glbUrl) + "&mode=ar_only&resizable=false#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(currentUrl) + ";end;";
                
                window.location.href = intentUrl;
            }
        });
    </script>

</body>
</html>
