<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastro AR Menu</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            font-family: sans-serif; text-align: center; color: white;
            overflow: hidden;
        }
        
        .ar-start-button { 
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); 
            color: black; border: none; font-size: 20px; font-weight: bold; 
            padding: 20px 40px; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.4);
            opacity: 0;
            animation: popInRotate 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes popInRotate {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .ar-start-button:active { transform: scale(0.95); }

        model-viewer { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            opacity: 0; pointer-events: none; z-index: -1;
        }
    </style>
</head>
<body>

    <button class="ar-start-button" id="startBtn">
        Zobraziť burger na stole 🍔
    </button>

    <model-viewer 
        id="viewer" 
        src="burger.glb" 
        ar 
        ar-scale="fixed"
        ar-modes="webxr" 
        autoplay
        disable-zoom>
    </model-viewer>

    <script>
        const btn = document.getElementById("startBtn");
        const viewer = document.getElementById("viewer");
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        // ANDROID: Poistka pre zastavenie animácie na konci
        viewer.addEventListener('load', () => {
            const checkAnimationEnd = () => {
                if (viewer.currentTime > 0 && viewer.duration > 0) {
                    if (viewer.currentTime >= viewer.duration - 0.05) {
                        viewer.pause(); 
                        return;
                    }
                }
                requestAnimationFrame(checkAnimationEnd);
            };
            requestAnimationFrame(checkAnimationEnd);
        });

        // KLIKNUTIE NA TLAČIDLO
        btn.addEventListener("click", () => {
            if (isIOS) {
                // IPHONE: Pridaný parameter autoplay=1 do URL
                const shareUrl = encodeURIComponent(window.location.href);
                const iosUrl = "burger.usdz#allowsContentScaling=0&autoplay=1&canonicalWebPageURL=" + shareUrl;
                
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', iosUrl);
                anchor.click();
            } else {
                viewer.activateAR();
            }
        });
    </script>
</body>
</html>
