<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"> <title>Gastro AR Menu</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }
        .ar-start-button { background: linear-gradient(135deg, #e6b800 0%, #cc9900 100%); color: black; border: none; font-size: 20px; font-weight: bold; padding: 20px 40px; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(230, 184, 0, 0.4); transition: transform 0.2s, box-shadow 0.2s; text-align: center; animation: start-button-fade 0.5s ease-out; }
        .ar-start-button:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(230, 184, 0, 0.2); }
        .hint-text { color: #aaa; font-size: 14px; margin-top: 15px; text-align: center; animation: start-button-fade 0.5s ease-out 0.2s; opacity: 0; animation-fill-mode: forwards; }
        .container { display: flex; flex-direction: column; align-items: center; }
        @keyframes start-button-fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Tento element na Androide zobrazí model, kým čakáme na WebXR */
        model-viewer {
            width: 1px; height: 1px; position: absolute; visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="ar-start-button" id="startBtn">
            Zobraziť burger na stole 🍔🍽️
        </button>
        <div class="hint-text">Naskenujte voľný stôl pred sebou</div>
    </div>

    <model-viewer 
        src="burger.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        autoplay
        animation-crossfade-duration="0.5"
        shadow-intensity="1">
    </model-viewer>

    <script>
        const startBtn = document.getElementById("startBtn");
        const modelViewer = document.querySelector("model-viewer");

        // Zistíme, či zákazník drží iPhone/iPad
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        if (isIOS) {
            startBtn.addEventListener("click", () => {
                // PRE IPHONE (Quick Look)
                // providesContentScaling=1 -> POVOLÍ ZVÄČŠOVANIE/ZMENŠOVANIE prstami
                // canShare=1 -> ZACHOVÁ funkciu fotenia a zdieľania
                const iosUrl = "burger.usdz#canShare=1&providesContentScaling=1";
                
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', iosUrl);
                anchor.click();
            });
        } else {
            // PRE ANDROID (WebXR / Google Model Viewer)
            // Zmeníme typ odpálenia. Namiesto natívnej aplikácie sa pokúsime spustiť WebXR priamo v Chrome.
            startBtn.addEventListener("click", () => {
                // Skúsime odpáliť WebXR rozhranie
                // Model Viewer sa postará o to, že povolí mierku prstami (pinch-to-zoom) automaticky.
                modelViewer.activateAR();
            });
        }
    </script>

</body>
</html>
