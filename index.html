<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gastro AR Menu</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }
        
        .container { display: flex; flex-direction: column; align-items: center; z-index: 10; }
        
        .ar-start-button { background: linear-gradient(135deg, #e6b800 0%, #cc9900 100%); color: black; border: none; font-size: 20px; font-weight: bold; padding: 20px 40px; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(230, 184, 0, 0.4); text-align: center; }
        .ar-start-button:active { transform: scale(0.95); }
        .hint-text { color: #aaa; font-size: 14px; margin-top: 15px; text-align: center; }

        /* Skutočný AR prehliadač - schovaný na pozadí, kým zákazník neklikne */
        model-viewer {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            visibility: hidden; z-index: 1;
        }
    </style>
</head>
<body>

    <div class="container" id="ui-container">
        <button class="ar-start-button" id="startBtn">
            Zobraziť burger na stole 🍔
        </button>
        <div class="hint-text">Naskenujte voľný stôl pred sebou</div>
    </div>

    <model-viewer 
        id="burgerViewer"
        src="burger.glb" 
        ios-src="burger.usdz"
        ar 
        ar-modes="webxr" 
        camera-controls
        disable-zoom
        animation-name="none"
        shadow-intensity="1.5"
        shadow-softness="1">
    </model-viewer>

    <script>
        const startBtn = document.getElementById("startBtn");
        const uiContainer = document.getElementById("ui-container");
        const modelViewer = document.getElementById("burgerViewer");

        startBtn.addEventListener("click", () => {
            // Skryjeme úvodné tlačidlo, aby nezavadzalo vo foťáku
            uiContainer.style.display = "none";
            modelViewer.style.visibility = "visible";
            
            // Odpálime čisté WebXR prostredie na stôl
            modelViewer.activateAR();
        });

        // Ak zákazník vypne AR režim, vrátime ho späť na obrazovku s tlačidlom
        modelViewer.addEventListener("ar-status", (event) => {
            if (event.detail.status === "not-presenting") {
                uiContainer.style.display = "flex";
                modelViewer.style.visibility = "hidden";
            }
        });
    </script>

</body>
</html>
