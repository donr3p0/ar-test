<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastro AR Menu</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            font-family: sans-serif; text-align: center; color: white;
        }
        
        .ar-start-button { 
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); 
            color: black; border: none; font-size: 20px; font-weight: bold; 
            padding: 20px 40px; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.4);
        }

        .ar-start-button:active { transform: scale(0.95); }

        /* Android model-viewer - na celú obrazovku ale úplne neviditeľný */
        model-viewer { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            opacity: 0; pointer-events: none; z-index: -1;
        }
    </style>
</head>
<body>

    <button class="ar-start-button" id="startBtn">
        Zobraziť burger na stole 🍔
    </button>

    <model-viewer id="viewer" src="burger.glb" ar ar-modes="webxr scene-viewer" disable-zoom></model-viewer>

    <script>
        const btn = document.getElementById("startBtn");
        const viewer = document.getElementById("viewer");
        
        // Detekcia, či je to iPhone
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        // Odpálenie AR po kliknutí
        btn.addEventListener("click", () => {
            if (isIOS) {
                // IPHONE triky (Zákaz zväčšovania a maskovanie zdieľania)
                const shareUrl = encodeURIComponent(window.location.href);
                const iosUrl = "burger.usdz#allowsContentScaling=0&canonicalWebPageURL=" + shareUrl;
                
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.appendChild(document.createElement('img'));
                anchor.setAttribute('href', iosUrl);
                anchor.click();
            } else {
                // ANDROID: Oficiálne spustenie WebXR cez priehľadný model-viewer
                viewer.activateAR();
            }
        });
    </script>

</body>
</html>
